name: Check

on:
  push:
    branches:
      - master
  pull_request:

# Read-only token so this is safe to run on a fork's pull request: the
# checkout gets no repository write access and no secrets.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install --ignore-scripts --no-audit --no-fund

      - run: npm run check
