<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gambit key</title>
  <script>
    const t = new URLSearchParams(location.search).get("theme");
    if (t) document.documentElement.dataset.theme = t;
  </script>
  <link rel="stylesheet" href="tokens.css">
  <style>
    h1 {
      filter: url(#bleed);
      font-size: 30px;
      line-height: 38px;
      font-weight: 500;
    }

    .steps {
      list-style: none;
      margin-top: 48px;
      counter-reset: s;
    }

    .steps li {
      counter-increment: s;
      display: grid;
      grid-template-columns: 36px 1fr;
      font-size: 18px;
      line-height: 28px;
    }

    .steps li+li {
      margin-top: 20px;
    }

    .steps li::before {
      content: counter(s);
      font-family: var(--hand);
      font-size: 24px;
      color: var(--graphite);
      filter: url(#graphite);
    }

    .steps .sub {
      display: block;
      font-size: 14px;
      line-height: 20px;
      color: var(--graphite);
    }

    .primary {
      margin-top: 48px;
    }

    .keyfield {
      margin-top: 40px;
    }

    .keyfield input {
      font-family: var(--mono);
      font-size: 16px;
    }

    .keyfield input::placeholder {
      font-family: var(--sans);
      font-size: 17px;
    }

    .status {
      margin-top: 10px;
      min-height: 20px;
    }

    .status.ok {
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status.ok svg {
      width: 16px;
      height: 16px;
    }

    .status.err {
      color: var(--accent);
    }

    .others .textaction {
      font-size: 14px;
      color: var(--graphite);
    }

    .foot {
      margin-top: auto;
      padding-top: 64px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .primary {
      transition: opacity .3s;
    }

    [data-works] .primary {
      opacity: .25;
    }
  </style>
</head>

<body>
  <main class="page">
    <h1>Get your free key</h1>
    <ol class="steps">
      <li><span>Open Google AI Studio<span class="sub">Sign in with any Google account</span></span></li>
      <li><span>Copy your key</span></li>
      <li><span>Paste it here</span></li>
    </ol>

    <button class="primary">Open Google AI Studio</button>

    <div class="keyfield">
      <label class="line-input">
        <input placeholder="Paste your key" spellcheck="false" autocomplete="off">
      </label>
      <p class="status small" aria-live="polite"></p>
    </div>

    <div class="foot small">
      <p class="others"><button class="textaction link">Other options</button></p>
      <p class="hand">Your key and your notebook stay on this device.</p>
    </div>
  </main>
  <script>
    const input = document.querySelector(".keyfield input");
    const status = document.querySelector(".status");

    function show(state) {
      status.className = "status small";
      document.body.toggleAttribute("data-works", state === "works");
      if (state === "works") {
        status.innerHTML = '<i data-lucide="check"></i>Key works'; window.lucide && lucide.createIcons({ attrs: { "stroke-width": 2, width: 16, height: 16 } }); status.classList.add("ok");
      } else if (state === "error") {
        status.textContent = "That key didn’t work. Copy it again from AI Studio. It starts with AQ.";
        status.classList.add("err");
      } else status.textContent = "";
    }
    input.addEventListener("input", () => {
      const v = input.value.trim();
      show(!v ? "" : v.startsWith("AQ.") && v.length > 20 ? "works" : v.length > 8 ? "error" : "");
    });

    const state = new URLSearchParams(location.search).get("state");
    if (state === "works") { input.value = "AQ.Ab8RN6Kx2vQm9pLw4TzY7hJcE1sFuD0g"; show("works"); }
    if (state === "error") { input.value = "AQ.Ab8RN6Kx2vQm9pLw"; show("error"); }
  </script>
  <script src="icons.js"></script>
  <script type="module" src="marks.js"></script>
</body>

</html>
